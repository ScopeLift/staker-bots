name: Code Quality

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['main']

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # pnpm/action-setup is still a Node-20 action; install pnpm via Node 24's
      # own npm instead so every action runs on Node 24 (no deprecation warning).
      - name: Install pnpm
        run: npm install -g pnpm@9.15.9

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint
